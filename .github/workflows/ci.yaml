name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run lint:ts
      - name: Unit tests
        run: npm test
      - name: Build
        # No database or Redis is reachable here; connections are opened lazily
        # so the build only needs the env vars that are read at import time.
        run: npm run build
        env:
          MAPBOX_ACCESS_TOKEN: ci-placeholder
          DATABASE_URL: postgres://ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
